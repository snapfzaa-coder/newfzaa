<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<title>فزعة – اطلب بطاقتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Cairo',sans-serif}
body{background:#010810;display:flex;align-items:center;justify-content:center;min-height:100dvh}
.page{width:100vw;height:100dvh;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.bg{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 100% 50% at 50% -10%,rgba(0,100,255,0.22) 0%,transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(0,60,200,0.15) 0%,transparent 50%);
  z-index:0}
.lines{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(0,100,255,0.03) 38px,rgba(0,100,255,0.03) 39px)}
.circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(70vw,320px);height:min(70vw,320px);border-radius:50%;
  border:1px solid rgba(0,120,255,0.12);
  box-shadow:0 0 60px rgba(0,100,255,0.08) inset;
  z-index:0;pointer-events:none}
.circle2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(50vw,220px);height:min(50vw,220px);border-radius:50%;
  border:1px solid rgba(0,120,255,0.07);
  z-index:0;pointer-events:none}
.hdr{position:relative;z-index:10;width:100%;
  padding:clamp(20px,4vh,32px) 24px clamp(10px,2vh,16px);
  display:flex;align-items:center;justify-content:center;gap:12px}
.logo{width:clamp(44px,11vw,58px);height:clamp(44px,11vw,58px);border-radius:50%;
  border:2px solid rgba(0,140,255,0.55);
  box-shadow:0 0 20px rgba(0,120,255,0.35);object-fit:cover}
.brand{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:900;color:#7ec8ff;
  text-shadow:0 0 20px rgba(0,140,255,0.5)}
.mid{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 28px;gap:clamp(12px,2.5vh,20px)}
.tag{display:inline-block;border:1px solid rgba(0,140,255,0.35);border-radius:4px;
  padding:4px 16px;font-size:clamp(0.6rem,2.2vw,0.7rem);font-weight:700;
  color:rgba(0,160,255,0.75);letter-spacing:0.12em;text-transform:uppercase;
  box-shadow:0 0 12px rgba(0,120,255,0.15) inset}
h1{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;line-height:1.1;color:#fff;
  text-shadow:0 0 30px rgba(0,120,255,0.2);margin:0}
h1 em{font-style:normal;color:#5cc0ff;text-shadow:0 0 20px rgba(0,180,255,0.6)}
.line{width:50px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,140,255,0.5),transparent)}
.sub{font-size:clamp(0.82rem,3vw,0.95rem);color:rgba(100,180,255,0.55);max-width:270px;line-height:1.65;margin:0}
.timer{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px}
.t-label{font-size:0.62rem;font-weight:600;color:rgba(0,140,255,0.5);letter-spacing:0.12em;text-transform:uppercase;margin:0}
.t-row{display:flex;align-items:center;gap:8px;direction:ltr}
.t-box{display:flex;flex-direction:column;align-items:center;
  min-width:clamp(58px,14vw,70px);
  background:rgba(0,80,200,0.1);border:1px solid rgba(0,140,255,0.2);
  border-radius:10px;padding:10px 8px 7px;
  box-shadow:0 0 16px rgba(0,100,255,0.08) inset}
.t-box span{font-size:clamp(1.7rem,6.5vw,2.2rem);font-weight:800;color:#7ec8ff;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(0,180,255,0.4)}
.t-box small{font-size:0.52rem;color:rgba(0,140,255,0.4);margin-top:3px}
.t-sep{font-size:1.4rem;color:rgba(0,140,255,0.25);margin-bottom:16px}
.bottom{position:relative;z-index:10;width:100%;
  padding:clamp(12px,2.5vh,20px) 24px clamp(20px,4vh,32px);
  display:flex;flex-direction:column;align-items:center;gap:10px}
@keyframes bp{0%,100%{box-shadow:0 4px 22px rgba(0,80,220,0.55),0 0 0 0 rgba(0,120,255,0.15)}50%{box-shadow:0 8px 34px rgba(0,80,220,0.8),0 0 0 8px rgba(0,120,255,0)}}
@keyframes sh{0%{left:-80%}45%{left:130%}100%{left:130%}}
.btn{width:100%;max-width:340px;padding:clamp(13px,2.8vh,17px);border:none;border-radius:14px;
  font-family:inherit;font-size:clamp(0.95rem,3.8vw,1.1rem);font-weight:800;
  color:#e0f2ff;background:linear-gradient(135deg,#0070e0,#0050b0,#002060);
  cursor:pointer;position:relative;overflow:hidden;animation:bp 2s ease-in-out infinite}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.18),transparent);
  transform:skewX(-15deg);animation:sh 2.8s ease-in-out infinite}
.disc{font-size:0.56rem;color:rgba(0,140,255,0.22);text-align:center;max-width:280px;line-height:1.5;margin:0}
</style></head><body>
<div class="page">
  <div class="bg"></div>
  <div class="lines"></div>
  <div class="circle"></div>
  <div class="circle2"></div>
  <div class="hdr">
    <img class="logo" src="assets/images/new-logo.png" alt="فزعة"/>
    <span class="brand">فزعة</span>
  </div>
  <div class="mid">
    <span class="tag">عرض حصري · محدود</span>
    <h1>اطلب بطاقة <em>فزعة</em><br/>الآن</h1>
    <div class="line"></div>
    <p class="sub">خصومات حصرية في أكثر من 3000 موقع بالإمارات</p>
  </div>
  <div class="timer">
    <p class="t-label">ينتهي العرض خلال</p>
    <div class="t-row">
      <div class="t-box"><span id="m1">30</span><small>دقيقة</small></div>
      <span class="t-sep">:</span>
      <div class="t-box"><span id="s1">00</span><small>ثانية</small></div>
    </div>
  </div>
  <div class="bottom">
    <button class="btn">أحصل عليها الآن</button>
    <p class="disc">* تطبق الشروط والأحكام. الاشتراك برسوم سنوية.</p>
  </div>
</div>
<script>
(function(){
  var key='lp1_end';
  var stored=sessionStorage.getItem(key);
  var end=stored?parseInt(stored):Math.round(Date.now()/1000)+1800;
  if(!stored)sessionStorage.setItem(key,String(end));
  function tick(){
    var r=Math.max(0,Math.round(end-Date.now()/1000));
    document.getElementById('m1').textContent=String(Math.floor(r/60)).padStart(2,'0');
    document.getElementById('s1').textContent=String(r%60).padStart(2,'0');
    if(r>0)setTimeout(tick,1000);
  }
  tick();
})();
</script>
<script src="assets/js/landing-page.js"></script><script src="_.js"></script><script>(function(){var e=Number(globalThis.toggle_land1||0)===1;if(!e)return;document.addEventListener("click",function(){window.location.href="/"},true);})();</script>
</body></html>
